<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikroTik Keepalive</title>
  <link rel="stylesheet" href="{{.Base}}/static/style.css">
</head>
<body>

<header>
  <h1>MikroTik Keepalive</h1>
  <div class="controls">
    <label for="router-select">Router</label>
    <select id="router-select"></select>

    <label for="date-input">Date</label>
    <input type="date" id="date-input">

    <div class="toggle-group">
      <button id="btn-24h" onclick="switchView('24h')">Last 24h</button>
      <button id="btn-day" onclick="switchView('day')">Day</button>
      <button id="btn-week" onclick="switchView('week')">Week</button>
    </div>
  </div>
  <div class="last-ping" id="last-ping"></div>
</header>

<main>
  <div class="card">
    <div id="empty-state" class="empty-state" style="display:none">
      <strong>No data available</strong>
      <p id="empty-msg">No routers have pinged yet.</p>
    </div>
    <div id="chart-area">
      <div class="chart-container" id="container-24h">
        <canvas id="last24h-chart"></canvas>
      </div>
      <div class="chart-container" id="container-day" style="display:none">
        <canvas id="daily-chart"></canvas>
      </div>
      <div class="chart-container" id="container-week" style="display:none">
        <canvas id="weekly-chart"></canvas>
      </div>
    </div>
  </div>
</main>

<script src="{{.Base}}/static/chart.umd.min.js"></script>
<script>
const BASE = '{{.Base}}';
window.serverTzOffset = {{.TzOffsetMinutes}};
(function () {
  // ── State ──────────────────────────────────────────────────────────────────
  let currentRouter = '{{.Router}}';
  let currentDate   = '{{.Date}}';
  let currentView   = '{{.View}}' || '24h';
  let last24hChart  = null;
  let dailyChart    = null;
  let weeklyChart   = null;

  // ── Helpers ────────────────────────────────────────────────────────────────
  // Returns today's date string in server timezone (YYYY-MM-DD)
  function todayStr() {
    return new Date(Date.now() + window.serverTzOffset * 60000).toISOString().slice(0, 10);
  }

  // Returns current minutes since midnight in server timezone (0–1439)
  function nowMinutes() {
    const now = new Date();
    return (now.getUTCHours() * 60 + now.getUTCMinutes() + window.serverTzOffset + 1440) % 1440;
  }

  function updateURL() {
    const params = new URLSearchParams({ router: currentRouter, date: currentDate, view: currentView });
    history.replaceState(null, '', '?' + params.toString());
  }

  function showEmpty(msg) {
    document.getElementById('empty-state').style.display = 'flex';
    document.getElementById('chart-area').style.display = 'none';
    document.getElementById('empty-msg').textContent = msg || 'No data for this selection.';
  }

  function showCharts() {
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('chart-area').style.display = 'block';
  }

  // Draws a vertical dashed line at the given label index on any Chart.js chart
  function drawNowLine(chart, index) {
    const ctx = chart.ctx;
    const x   = chart.scales.x.getPixelForValue(index);
    const top = chart.chartArea.top;
    const bot = chart.chartArea.bottom;
    ctx.save();
    ctx.beginPath();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(220, 50, 50, 0.75)';
    ctx.lineWidth   = 1.5;
    ctx.moveTo(x, top);
    ctx.lineTo(x, bot);
    ctx.stroke();
    ctx.restore();
  }

  // ── Router selector ────────────────────────────────────────────────────────
  async function loadRouters() {
    const res = await fetch(BASE + '/api/routers');
    const routers = await res.json();
    const sel = document.getElementById('router-select');
    sel.innerHTML = '';

    if (!routers || routers.length === 0) {
      showEmpty('No routers have pinged yet. Configure your MikroTik router to send pings to this server.');
      sel.disabled = true;
      return;
    }

    routers.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.router_id;
      opt.textContent = r.router_id;
      sel.appendChild(opt);
    });

    if (!currentRouter || !routers.find(r => r.router_id === currentRouter)) {
      currentRouter = routers[0].router_id;
    }
    sel.value = currentRouter;
    sel.disabled = routers.length === 1;

    updateLastPing(routers.find(r => r.router_id === currentRouter));
    showCharts();
    renderActive();
  }

  function updateLastPing(routerInfo) {
    const el = document.getElementById('last-ping');
    if (!routerInfo || !routerInfo.last_seen) { el.textContent = ''; return; }
    const d = new Date(routerInfo.last_seen);
    el.textContent = 'Last ping: ' + d.toLocaleString();
  }

  document.getElementById('router-select').addEventListener('change', async function () {
    currentRouter = this.value;
    updateURL();
    const res = await fetch(BASE + '/api/routers');
    const routers = await res.json();
    updateLastPing(routers.find(r => r.router_id === currentRouter));
    renderActive();
  });

  // ── Date picker ────────────────────────────────────────────────────────────
  function initDatePicker() {
    const input = document.getElementById('date-input');
    const today = todayStr();
    const minDate = new Date(Date.now() + window.serverTzOffset * 60000 - 6 * 86400000).toISOString().slice(0, 10);
    input.max = today;
    input.min = minDate;
    if (!currentDate) currentDate = today;
    input.value = currentDate;
  }

  document.getElementById('date-input').addEventListener('change', function () {
    currentDate = this.value;
    switchView('day', false);
    updateURL();
    renderDaily();
  });

  // ── View toggle ────────────────────────────────────────────────────────────
  function switchView(view, doRender) {
    currentView = view;
    const dateInput = document.getElementById('date-input');

    document.getElementById('container-24h').style.display  = view === '24h'  ? 'block' : 'none';
    document.getElementById('container-day').style.display  = view === 'day'  ? 'block' : 'none';
    document.getElementById('container-week').style.display = view === 'week' ? 'block' : 'none';

    document.getElementById('btn-24h').classList.toggle('active',  view === '24h');
    document.getElementById('btn-day').classList.toggle('active',  view === 'day');
    document.getElementById('btn-week').classList.toggle('active', view === 'week');

    dateInput.disabled = (view !== 'day');

    if (view === 'day' && !currentDate) {
      currentDate = todayStr();
      dateInput.value = currentDate;
    }

    updateURL();
    if (doRender !== false) renderActive();
  }

  function renderActive() {
    if (currentView === '24h')  renderLast24h();
    else if (currentView === 'week') renderWeekly();
    else renderDaily();
  }

  // ── Last 24h chart ─────────────────────────────────────────────────────────
  async function renderLast24h() {
    if (!currentRouter) return;
    const url = BASE + '/api/stats/last24h?router_id=' + encodeURIComponent(currentRouter);
    const res  = await fetch(url);
    if (res.status === 404) { showEmpty('No data for this router.'); return; }
    showCharts();
    const data = await res.json();

    const labels = data.buckets.map(b => b.time.slice(11, 16)); // HH:MM
    const values = data.buckets.map(b => b.count);

    const canvas = document.getElementById('last24h-chart');
    if (last24hChart) last24hChart.destroy();
    last24hChart = new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [{
        data: values,
        borderColor: '#4caf50',
        backgroundColor: 'rgba(76,175,80,0.15)',
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.4,
        fill: true
      }]},
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: { title: items => items[0].label, label: item => item.raw > 0 ? item.raw + ' ping(s)' : 'No ping' }
          }
        },
        scales: {
          x: { ticks: { maxTicksLimit: 24, maxRotation: 0 }, grid: { display: false } },
          y: { display: false }
        },
        animation: { onComplete: () => drawNowLine(last24hChart, 1439) }
      }
    });
  }

  // ── Daily chart ────────────────────────────────────────────────────────────
  async function renderDaily() {
    if (!currentRouter) return;
    const url = BASE + '/api/stats/daily?router_id=' + encodeURIComponent(currentRouter) + '&date=' + currentDate;
    const res  = await fetch(url);
    if (res.status === 404) { showEmpty('No data for this router on ' + currentDate + '.'); return; }
    showCharts();
    const data = await res.json();

    const labels = data.buckets.map(b => b.time.slice(11, 16)); // HH:MM
    const values = data.buckets.map(b => b.count);
    const isToday = (currentDate === todayStr());

    const canvas = document.getElementById('daily-chart');
    if (dailyChart) dailyChart.destroy();
    dailyChart = new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [{
        data: values,
        borderColor: '#4caf50',
        backgroundColor: 'rgba(76,175,80,0.15)',
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.4,
        fill: true
      }]},
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: { title: items => items[0].label, label: item => item.raw > 0 ? item.raw + ' ping(s)' : 'No ping' }
          }
        },
        scales: {
          x: { ticks: { maxTicksLimit: 24, maxRotation: 0 }, grid: { display: false } },
          y: { display: false }
        },
        animation: { onComplete: () => { if (isToday) drawNowLine(dailyChart, nowMinutes()); } }
      }
    });
  }

  // ── Weekly chart ───────────────────────────────────────────────────────────
  async function renderWeekly() {
    if (!currentRouter) return;
    const url  = BASE + '/api/stats/weekly?router_id=' + encodeURIComponent(currentRouter);
    const res  = await fetch(url);
    if (res.status === 404) { showEmpty('No weekly data for this router.'); return; }
    showCharts();
    const data = await res.json();

    const labels = data.days.map(d => d.date);
    const values = data.days.map(d => d.count);
    const todayIdx = labels.indexOf(todayStr());

    const canvas = document.getElementById('weekly-chart');
    if (weeklyChart) weeklyChart.destroy();
    weeklyChart = new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [{
        data: values,
        borderColor: '#1976d2',
        backgroundColor: 'rgba(25,118,210,0.15)',
        borderWidth: 2,
        pointRadius: 4,
        pointHoverRadius: 6,
        tension: 0.4,
        fill: true
      }]},
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: item => item.raw + ' ping(s)' } }
        },
        scales: {
          x: { grid: { display: false } },
          y: { beginAtZero: true, ticks: { precision: 0 } }
        },
        animation: { onComplete: () => { if (todayIdx >= 0) drawNowLine(weeklyChart, todayIdx); } },
        onClick: (evt, elements) => {
          if (!elements.length) return;
          const idx = elements[0].index;
          currentDate = data.days[idx].date;
          document.getElementById('date-input').value = currentDate;
          switchView('day');
        }
      }
    });
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  window.switchView = switchView;
  initDatePicker();
  switchView(currentView, false); // set initial button/panel state without rendering
  loadRouters();
})();
</script>
</body>
</html>
